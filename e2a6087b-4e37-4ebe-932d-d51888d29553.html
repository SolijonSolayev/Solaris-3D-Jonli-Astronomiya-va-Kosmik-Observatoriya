<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solaris 3D</title>
    <meta
      name="description"
      content="Solaris 3D - Real-time astronomical and optical simulation experience."
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #0f172a 0%, #020817 55%, #000 100%);
        color: #e2e8f0;
        font-family: Arial, Helvetica, sans-serif;
      }
      main {
        text-align: center;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 4rem);
        letter-spacing: 0.08em;
      }
      p {
        margin: 0;
        font-size: 1.05rem;
        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Solaris 3D</h1>
      <p>Jonli astronomiya va kosmik observatoriya.</p>
    </main>
  </body>
</html>
